name: Publish Skill Registry

on:
  push:
    branches:
      - main
    paths:
      - 'categories/**'
      - 'tools/**'
  workflow_dispatch:

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f tools/requirements.txt ]; then pip install -r tools/requirements.txt; fi

      - name: Validate skills
        run: |
          python tools/validate_skill.py --all

      - name: Generate registry artifact
        run: |
          python tools/update_registry.py

      - name: Sign registry manifest
        # Ed25519 (asymmetric) is preferred when the SKILLS_ED25519_PRIVATE_KEY
        # secret is configured (generate once with: python tools/sign_manifest.py
        # keygen). Pin the matching public key for verifiers. Until that secret
        # exists, fall back to the legacy shared-secret HMAC scheme so CI keeps
        # working — migration follow-up: make Ed25519 mandatory.
        env:
          SIGNING_KEY: ${{ secrets.SKILLS_SIGNING_KEY || 'dev-fallback-key' }}
          SKILLS_ED25519_PRIVATE_KEY: ${{ secrets.SKILLS_ED25519_PRIVATE_KEY }}
        run: |
          if [ -n "$SKILLS_ED25519_PRIVATE_KEY" ]; then
            python tools/sign_manifest.py sign registry.json --ed25519 > registry-signature.json
          else
            python tools/sign_manifest.py sign registry.json --key "$SIGNING_KEY" > registry-signature.json
          fi
          cat registry-signature.json

      - name: Upload registry artifacts
        uses: actions/upload-artifact@v4
        with:
          name: skill-registry
          path: |
            registry.json
            registry-signature.json
          retention-days: 90

      - name: Publish registry to the rolling release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # One moving release holds the current registry. The Actions
          # artifact above is retained separately for 90-day forensics.
          # --latest=false keeps this rolling tag from displacing real
          # version tags in the GitHub UI; the CLI addresses the tag
          # directly, not /releases/latest/.
          if ! gh release view registry-latest >/dev/null 2>&1; then
            gh release create registry-latest \
              --title "Skill registry (rolling)" \
              --notes "Generated registry.json for the current main. Updated automatically; do not delete." \
              --latest=false
          fi
          gh release upload registry-latest \
            registry.json registry-signature.json --clobber
