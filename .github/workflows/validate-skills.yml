name: Validate Skills

on:
  pull_request:
    paths:
      - 'categories/**'
      - '.claude-plugin/**'
      - '.codex-plugin/**'
      - '.cursor-plugin/**'
      - 'registry.json'
      - 'VERSION'
      - 'tools/**'
      - '.github/workflows/validate-skills.yml'
  push:
    branches: [main]
    paths:
      - 'categories/**'
      - 'registry.json'
      - 'VERSION'
      - 'tools/**'
      - '.github/workflows/validate-skills.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.11'
      - run: pip install -r tools/requirements.txt
      - name: Compile category payload scripts
        # Catch hard Python syntax errors in shipped skill scripts. These are
        # never imported by the test suite, so without this step a SyntaxError
        # in categories/**/scripts/*.py ships undetected.
        run: python3 -m compileall -q categories
      - name: Frontmatter validation
        run: >-
          python3 tools/validate_skill.py --all
          --warning-budget tools/validation_warning_budget.json
      - name: Registry drift check
        # Keep registry.json synchronized with canonical category metadata.
        run: python3 tools/update_registry.py && python3 tools/update_registry.py --check
      - name: Version sync check
        run: python3 tools/check_version_sync.py
      - name: Marketplace sync check
        # Fail if .claude-plugin/marketplace.json is stale vs categories/, so the
        # Claude Code plugin marketplace always surfaces every skill. Regenerate
        # with: python3 tools/sync_marketplace.py
        run: python3 tools/sync_marketplace.py --check
      - name: Reference integrity
        run: python3 tools/check_references.py
      - name: Self-containment check
        run: python3 tools/check_self_contained.py
      - name: Secret scan
        # Strict mode makes any high-confidence credential finding fail CI.
        run: python3 tools/check_secrets.py --strict
      - name: Shell-command audit
        # Strict mode fails CI on any unallowlisted curl/wget-piped-to-shell
        # pattern. See tools/shell_command_allowlist.txt and
        # tools/shell_command_path_allowlist.txt to add legitimate cases.
        run: python3 tools/check_shell_commands.py --strict
      - name: License compatibility gate
        # Strict: copyleft (GPL/LGPL/AGPL) content must not be vendored into the
        # MIT-rooted repo. See NOTICE for the policy.
        run: python3 tools/check_licenses.py
