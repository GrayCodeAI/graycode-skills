openapi: "3.1.0"
info:
  title: graycode-skills — Skill Registry Reference
  description: |
    GrayCode Skills: community skill packages for Rho, the terminal AI coding
    agent. Each skill is a Markdown file with YAML frontmatter that Rho (or any
    Agent Skills client) loads when the skill is activated.

    This is a skill registry: no HTTP server is exposed. Skills are installed
    with the Rho CLI: `rho skills install GrayCodeAI/graycode-skills <name>`.
    The generated index is published as registry.json on the rolling
    `registry-latest` GitHub release (see docs/REGISTRY.md).
  version: "0.0.1"
  license:
    name: MIT
    url: https://github.com/GrayCodeAI/graycode-skills/blob/main/LICENSE
  contact:
    url: https://github.com/GrayCodeAI/graycode-skills

# No servers: skills are installed with the Rho CLI, not over HTTP.

x-skill-format:
  required_frontmatter:
    - name (string, must match directory name)
    - description (string, max 200 chars)
    - license (string, e.g. MIT; copyleft is not accepted)
    - tags (1-5 lowercase kebab-case strings; top-level list or metadata.tags)
  optional_frontmatter:
    - metadata (map of string to string, e.g. author, version)
    - compatibility (string, max 500 chars)
    - allowed-tools (space-separated string)
  schema_source: manifest-schema.toml ([enforced] is the CI gate)
  skill_directory_structure:
    SKILL.md: "Required entry point with frontmatter + instructions"
    templates/: "Optional template files"
    examples/: "Optional example files"
    scripts/: "Optional Python/shell scripts (must have shebang + exec bit)"
    references/: "Optional reference documents"
    assets/: "Optional static assets"

x-cli-commands:
  install:
    description: Install a skill into Rho (user scope by default; --scope project)
    usage: rho skills install GrayCodeAI/graycode-skills <skill-name>
  search:
    description: Search the skill registry
    usage: rho skills search <query>
  list:
    description: List installed skills
    usage: rho skills list
