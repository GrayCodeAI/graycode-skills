# hawk-community-skills manifest schema
#
# Every skill in this registry MUST include a SKILL.md file with YAML
# frontmatter that conforms to this schema. The schema is expressed in TOML
# for human readability; the CI validation script (scripts/validate-skill.py)
# enforces it programmatically.
#
# Required fields are marked  required = true.
# Optional fields default to the value shown under "default".
# Allowed values are listed under "enum" where applicable.

[schema]
version = "2.0"

# ── Identity ──────────────────────────────────────────────────────────────────

[fields.name]
type        = "string"
required    = true
pattern     = "^[a-z0-9][a-z0-9-]{2,79}$"
description = "URL-safe kebab-case identifier. Must be unique in the registry."

[fields.description]
type        = "string"
required    = true
max_length  = 280
description = "One-sentence summary shown in the skill catalogue."

[fields.version]
type        = "string"
required    = true
pattern     = "^\\d+\\.\\d+(\\.\\d+)?$"
description = "Semantic version string, e.g. \"1.0\" or \"2.3.1\"."

[fields.author]
type        = "string"
required    = true
description = "GitHub username or real name of the primary author."

[fields.license]
type        = "string"
required    = true
enum        = ["MIT", "Apache-2.0", "GPL-3.0", "BSD-2-Clause", "BSD-3-Clause", "CC0-1.0", "MPL-2.0"]
description = "SPDX license identifier."

# ── Classification ────────────────────────────────────────────────────────────

[fields.domain]
type        = "string"
required    = true
enum        = [
  "coding",
  "cybersecurity",
  "data-science",
  "devops",
  "documentation",
  "research",
  "testing",
  "other",
]
description = "Primary domain of the skill."

[fields.subdomain]
type        = "string"
required    = false
max_length  = 60
description = "Optional finer-grained categorisation within domain."

[fields.tags]
type        = "array"
items.type  = "string"
required    = true
min_items   = 1
max_items   = 12
description = "Searchable tags. Use lowercase kebab-case. At least one tag required."

# ── Capability metadata ───────────────────────────────────────────────────────

[fields.phase]
type        = "string"
required    = false
enum        = ["localize", "repair", "validate", "review", "planning", "any"]
default     = "any"
description = "Pipeline phase where this skill is most useful. Maps to hawk-core-contracts/sessions.Phase."

[fields.min_model]
type        = "string"
required    = false
enum        = ["haiku", "sonnet", "opus", "any"]
default     = "any"
description = "Minimum capable model tier. 'any' means the skill works on all tiers."

[fields.context_tokens]
type        = "integer"
required    = false
minimum     = 256
maximum     = 200000
default     = 4096
description = "Approximate token budget this skill consumes per invocation."

[fields.tools_required]
type        = "array"
items.type  = "string"
required    = false
description = "List of tool names (e.g. 'bash', 'file_search') the skill depends on."

# ── Authorship & quality ──────────────────────────────────────────────────────

[fields.maintainers]
type        = "array"
items.type  = "string"
required    = false
description = "Additional GitHub usernames responsible for maintaining the skill."

[fields.tested_on]
type        = "array"
items.type  = "string"
required    = false
description = "Model IDs this skill has been validated against, e.g. ['claude-sonnet-4-6']."

[fields.deprecated]
type        = "boolean"
required    = false
default     = false
description = "Set to true to mark the skill as deprecated; it will be hidden from the default catalogue."

[fields.superseded_by]
type        = "string"
required    = false
description = "Name of the skill that replaces this one. Only meaningful when deprecated=true."

# ── Agent Skills Spec (agentskills.io) ────────────────────────────────────────
# The following fields implement the agentskills.io specification for
# cross-agent skill interoperability. They are optional but strongly
# recommended for skills that should work across hawk, Claude Code,
# Codex, and other agent runtimes.

[fields.category]
type        = "string"
required    = false
enum        = ["engineering", "ops", "testing", "security", "devtools", "workflow"]
description = "Agent Skills spec category. Maps to hawk's SmartSkill.Category field."

[fields.auto_invoke]
type        = "boolean"
required    = false
default     = false
description = "If true, the model may trigger this skill without an explicit /command. Maps to SmartSkill.AutoInvoke."

[fields.compatibility]
type        = "string"
required    = false
max_length  = 200
description = "Environment requirements string (e.g. 'node>=20 python>=3.9'). Maps to SmartSkill.Compatibility."

[fields.allowed_tools]
type        = "string"
required    = false
description = "Space-separated list of pre-approved tool names. Maps to SmartSkill.AllowedTools."

[fields.agents]
type        = "array"
items.type  = "string"
required    = false
description = "Cross-agent compatibility list (e.g. ['hawk', 'claude-code', 'codex']). Maps to SmartSkill.Agents."

[fields.invoke]
type        = "string"
required    = false
pattern     = "^[a-z0-9][a-z0-9-]*:[a-z0-9][a-z0-9-]*$"
description = "Namespaced invocation pattern (e.g. 'vendor:skill'). Maps to SmartSkill.Invoke."

[fields.refs]
type        = "array"
items.type  = "string"
required    = false
description = "Declared @ref() references to other skills or resources. Maps to SmartSkill.Refs."

[fields.chain_after]
type        = "array"
items.type  = "string"
required    = false
description = "Skills that should run before this one. Part of SmartSkill.Chain.After."

[fields.chain_before]
type        = "array"
items.type  = "string"
required    = false
description = "Skills to suggest after this one completes. Part of SmartSkill.Chain.Before."

[fields.chain_conflicts]
type        = "array"
items.type  = "string"
required    = false
description = "Skills that cannot be active simultaneously. Part of SmartSkill.Chain.Conflicts."

[fields.chain_enhances]
type        = "array"
items.type  = "string"
required    = false
description = "Skills that work well together (advisory). Part of SmartSkill.Chain.Enhances."
