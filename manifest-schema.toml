# graycode-skills manifest schema
#
# Every skill in this registry MUST include a SKILL.md file with YAML
# frontmatter. Two layers live in this file:
#
# * [enforced] (at the bottom) is the gate CI runs today. tools/validate_skill.py
#   reads it at start-up and refuses to run if it is missing or malformed, so
#   the gate and this document cannot drift. It is what CONTRIBUTING.md
#   documents.
# * [fields] describes every recognized field and the forward (v2.0) target.
#   `required = true` there is NOT yet required of the existing corpus; only
#   the [enforced] required_fields are. Patterns and enums under [fields] are
#   guidance for new skills unless [enforced] or the validator applies them
#   ([fields.invoke].pattern is enforced when `invoke` is present).
#
# Allowed values are listed under "enum" where applicable.

[schema]
version = "2.0"

# ── Identity ──────────────────────────────────────────────────────────────────

[fields.name]
type        = "string"
required    = true
max_length  = 64
pattern     = "^[a-z0-9]+(-[a-z0-9]+)*$"
description = "Agent Skills name: 1-64 lowercase letters/digits with single inner hyphens, equal to the directory name, unique in the registry. (Enforced today: must match the directory; about 3,300 legacy names do not meet the pattern, see docs/AGENT_SKILLS.md.)"

[fields.description]
type        = "string"
required    = true
max_length  = 200
description = "What the skill does and when to use it, shown in the skill catalogue. The Agent Skills spec allows 1024 characters; this catalogue caps it at [enforced].max_description_length."

[fields.version]
type        = "string"
required    = true
pattern     = "^\\d+\\.\\d+(\\.\\d+)?$"
description = "Semantic version string, e.g. \"1.0\" or \"2.3.1\"."

[fields.author]
type        = "string"
required    = true
description = "GitHub username or real name of the primary author."

[fields.license]
type        = "string"
required    = true
enum        = ["MIT", "Apache-2.0", "BSD-2-Clause", "BSD-3-Clause", "ISC", "CC0-1.0", "CC-BY-4.0", "MPL-2.0"]
description = "SPDX license identifier of the skill itself. Copyleft (GPL/LGPL/AGPL) is not accepted; see NOTICE and tools/check_licenses.py."

# ── Classification ────────────────────────────────────────────────────────────

[fields.domain]
type        = "string"
required    = true
enum        = [
  "coding",
  "cybersecurity",
  "data-science",
  "devops",
  "documentation",
  "research",
  "testing",
  "other",
]
description = "Primary domain of the skill."

[fields.subdomain]
type        = "string"
required    = false
max_length  = 60
description = "Optional finer-grained categorisation within domain."

[fields.tags]
type        = "array"
items.type  = "string"
required    = true
min_items   = 1
max_items   = 5
description = "Searchable tags, lowercase kebab-case. Either a top-level list (corpus convention) or, for Agent Skills-conformant skills, a comma- or space-separated string in metadata.tags."

# ── Capability metadata ───────────────────────────────────────────────────────

[fields.phase]
type        = "string"
required    = false
enum        = ["localize", "repair", "validate", "review", "planning", "any"]
default     = "any"
description = "Pipeline phase where this skill is most useful. Maps to eagle/sessions.Phase."

[fields.min_model]
type        = "string"
required    = false
enum        = ["haiku", "sonnet", "opus", "any"]
default     = "any"
description = "Minimum capable model tier. 'any' means the skill works on all tiers."

[fields.context_tokens]
type        = "integer"
required    = false
minimum     = 256
maximum     = 200000
default     = 4096
description = "Approximate token budget this skill consumes per invocation."

[fields.tools_required]
type        = "array"
items.type  = "string"
required    = false
description = "List of tool names (e.g. 'bash', 'file_search') the skill depends on."

# ── Authorship & quality ──────────────────────────────────────────────────────

[fields.maintainers]
type        = "array"
items.type  = "string"
required    = false
description = "Additional GitHub usernames responsible for maintaining the skill."

[fields.tested_on]
type        = "array"
items.type  = "string"
required    = false
description = "Model IDs this skill has been validated against, e.g. ['claude-sonnet-4-6']."

[fields.deprecated]
type        = "boolean"
required    = false
default     = false
description = "Set to true to mark the skill as deprecated; it will be hidden from the default catalogue."

[fields.superseded_by]
type        = "string"
required    = false
description = "Name of the skill that replaces this one. Only meaningful when deprecated=true."

# ── Agent Skills specification fields (agentskills.io) ────────────────────────
# The open standard allows only name, description, license, compatibility,
# metadata and allowed-tools at the top level of SKILL.md frontmatter.
# tools/check_agentskills.py checks a skill against it.

[fields.metadata]
type        = "table"
required    = false
description = "Agent Skills metadata: a map of string keys to string values. Put non-spec fields here (author, version, tags) to stay spec-conformant."

[fields.allowed-tools]
type        = "string"
required    = false
description = "Agent Skills allowed-tools: space-separated pre-approved tools (experimental in the spec)."

[fields.compatibility]
type        = "string"
required    = false
max_length  = 500
description = "Agent Skills compatibility: 1-500 characters of environment requirements (e.g. 'Requires git and the rho CLI'). Maps to SmartSkill.Compatibility."

# ── GrayCode extensions (NOT part of the Agent Skills specification) ─────────
# Optional fields some skills use. Clients that follow the spec strictly
# ignore or reject them; prefer metadata for new skills.

[fields.category]
type        = "string"
required    = false
enum        = ["engineering", "ops", "testing", "security", "devtools", "workflow"]
description = "Agent Skills spec category. Maps to graycode's SmartSkill.Category field."

[fields.auto_invoke]
type        = "boolean"
required    = false
default     = false
description = "If true, the model may trigger this skill without an explicit /command. Maps to SmartSkill.AutoInvoke."

[fields.allowed_tools]
type        = "string"
required    = false
description = "Legacy underscore spelling of allowed-tools. Maps to SmartSkill.AllowedTools."

[fields.agents]
type        = "array"
items.type  = "string"
required    = false
description = "Cross-agent compatibility list (e.g. ['graycode', 'claude-code', 'codex']). Maps to SmartSkill.Agents."

[fields.invoke]
type        = "string"
required    = false
pattern     = "^[a-z0-9][a-z0-9-]*:[a-z0-9][a-z0-9-]*$"
description = "Namespaced invocation pattern (e.g. 'vendor:skill'). Maps to SmartSkill.Invoke."

[fields.refs]
type        = "array"
items.type  = "string"
required    = false
description = "Declared @ref() references to other skills or resources. Maps to SmartSkill.Refs."

[fields.chain_after]
type        = "array"
items.type  = "string"
required    = false
description = "Skills that should run before this one. Part of SmartSkill.Chain.After."

[fields.chain_before]
type        = "array"
items.type  = "string"
required    = false
description = "Skills to suggest after this one completes. Part of SmartSkill.Chain.Before."

[fields.chain_conflicts]
type        = "array"
items.type  = "string"
required    = false
description = "Skills that cannot be active simultaneously. Part of SmartSkill.Chain.Conflicts."

[fields.chain_enhances]
type        = "array"
items.type  = "string"
required    = false
description = "Skills that work well together (advisory). Part of SmartSkill.Chain.Enhances."

# ── Enforced schema (single source of truth for the CI gate) ──────────────
# tools/validate_skill.py reads these values at start-up and exits with an
# error if any is missing or has the wrong type. These are the fields/limits
# the 14k-skill corpus actually satisfies today. The v2.0 fields marked
# `required = true` under [fields] (version, author, domain) are the forward
# target, not yet enforced. Tags are effectively required too: min_tags = 1
# makes a skill without tags an error.
[enforced]
required_fields        = ["name", "description", "license"]
max_description_length = 200
min_tags               = 1
max_tags               = 5
tag_pattern            = "^[a-z][a-z0-9]*(-[a-z0-9]+)*$"
