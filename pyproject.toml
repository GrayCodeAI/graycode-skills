[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "graycode-skills"
version = "0.0.1"
description = "GrayCode Skills: community skill packages for Rho, the terminal AI coding agent"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "rich>=13.0",
    "cryptography>=42.0",
]

[project.optional-dependencies]
# Reproducible dev/test toolchain. Install with: pip install -e '.[dev]'
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "pip-audit>=2.7",
]

[tool.ruff]
# The tooling requires Python 3.11 (tomllib); see requires-python.
target-version = "py311"
line-length = 100
# Scripts shipped inside skills run on end users' interpreters, not ours, so
# keep them linted as Python 3.9-compatible code.
per-file-target-version = { "categories/**" = "py39" }

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]
ignore = [
    "E402", "E501", "E722", "E741",
    "F401",
    "B005", "B007", "B018",
    "N802", "N806", "N813", "N815", "N817",
    "SIM102", "SIM115", "SIM117",
]

[tool.hatch.build.targets.wheel]
packages = ["tools"]

[tool.hatch.build.targets.sdist]
include = [
    "tools",
    "categories",
    "tests",
    "pyproject.toml",
    "README.md",
    "LICENSE",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tools"]
