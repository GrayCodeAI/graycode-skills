[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "starling"
version = "0.1.0"
description = "Community skill packages for hawk"
requires-python = ">=3.13"
dependencies = [
    "pyyaml>=6.0",
    "rich>=13.0",
    "cryptography>=42.0",
]

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]
ignore = [
    "E402", "E501", "E722", "E741",
    "F401",
    "B005", "B007", "B018",
    "N802", "N806", "N813", "N815", "N817",
    "SIM102", "SIM115", "SIM117",
]

[tool.hatch.build.targets.wheel]
packages = ["tools"]

[tool.hatch.build.targets.sdist]
include = [
    "tools",
    "categories",
    "tests",
    "pyproject.toml",
    "README.md",
    "LICENSE",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tools"]
